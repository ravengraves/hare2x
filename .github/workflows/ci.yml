name: Hare2X CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: hare2x

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm lld python3 ninja-build

      - name: Build
        working-directory: hare2x
        run: make -j2

      - name: Check
        working-directory: hare2x
        run: make check
